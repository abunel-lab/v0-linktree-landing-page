[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["corepack enable && corepack prepare pnpm@9 --activate && pnpm install --frozen-lockfile=false"]

[phases.build]
cmds = ["BASE_PATH=/ PORT=3000 pnpm --filter @workspace/nelson-labs run build"]

[start]
cmd = "node artifacts/nelson-labs/serve.mjs"
