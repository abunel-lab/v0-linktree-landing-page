kind = "web"
previewPath = "/"
title = "Nelson Labs Link in Bio"
version = "1.0.0"
id = "artifacts/nelson-labs"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23676

[services.development]
run = "pnpm --filter @workspace/nelson-labs run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nelson-labs", "run", "build" ]
publicDir = "artifacts/nelson-labs/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23676"
BASE_PATH = "/"
