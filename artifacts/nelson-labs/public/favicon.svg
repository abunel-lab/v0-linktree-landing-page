<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0a0f1a"/>
  <rect width="180" height="180" rx="36" fill="url(#grad)"/>
  <!-- Chart bars -->
  <rect x="28" y="108" width="18" height="36" rx="4" fill="#00C9A7" opacity="0.6"/>
  <rect x="52" y="88" width="18" height="56" rx="4" fill="#00C9A7" opacity="0.75"/>
  <rect x="76" y="68" width="18" height="76" rx="4" fill="#00C9A7" opacity="0.9"/>
